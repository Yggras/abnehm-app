<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYP – Momos Insel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="device"><main id="app"></main><div id="sheet-root"></div></div>

  <aside class="lab collapsed" id="lab">
    <button class="lab__toggle" id="lab-toggle" aria-expanded="false">Simulation &amp; Regeln <span>⌄</span></button>
    <div class="lab__body" id="lab-body"></div>
  </aside>

  <nav class="switcher" aria-label="Prototyp-Varianten">
    <button id="previous" aria-label="Vorherige Variante">←</button>
    <span id="variant-label"></span>
    <button id="next" aria-label="Nächste Variante">→</button>
  </nav>
  <div class="toast" id="toast"></div>

  <script src="island-iso.js"></script>
  <script src="island-map.js"></script>
  <script src="app.js"></script>
</body>
</html>
