<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYP – Gamification-Konzept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <aside class="lab" id="lab">
    <button class="lab__toggle" id="lab-toggle" aria-expanded="true">Simulation <span>⌄</span></button>
    <div class="lab__body">
      <p class="lab__hint">Was ist heute passiert?</p>
      <div class="lab__people">
        <fieldset>
          <legend>Philipp</legend>
          <button data-event="success" data-person="philipp">Ziel geschafft</button>
          <button data-event="miss" data-person="philipp">Ziel verpasst</button>
        </fieldset>
        <fieldset>
          <legend>Partnerin</legend>
          <button data-event="success" data-person="partnerin">Ziel geschafft</button>
          <button data-event="miss" data-person="partnerin">Ziel verpasst</button>
        </fieldset>
      </div>
      <div class="lab__actions">
        <button data-event="nudge">💛 Anfeuern</button>
        <button data-event="next">Nächster Tag</button>
        <button data-event="reset">Zurücksetzen</button>
      </div>
      <details>
        <summary>Vollständiger Zustand</summary>
        <pre id="state-output"></pre>
      </details>
    </div>
  </aside>

  <nav class="switcher" aria-label="Prototyp-Varianten">
    <button id="previous" aria-label="Vorherige Variante">←</button>
    <span id="variant-label"></span>
    <button id="next" aria-label="Nächste Variante">→</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
