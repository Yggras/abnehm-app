# Teilablauf: frische App, Seed „solo“ über den Seed-Deep-Link (#112) und direkter Einstieg auf „Heute“.
# Der Seed setzt das lokale E2E-Backend zurück, meldet philipp@example.test an und stellt die Testuhr
# auf 2026-10-14T12:00:00Z in Europe/Berlin (Mittwoch).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: ${SCHEME}://seed?szenario=solo
- extendedWaitUntil:
    visible: "Hallo, Philipp"
    timeout: 30000
- assertVisible: "Mittwoch, 14.10.2026"
