# Teilablauf: öffnet einen Deep Link der Testfähigkeiten (${LINK}, ohne Schema) im E2E-Build.
#
# iOS-Simulator (iOS 27.0, Maestro 2.11.0, beobachtet am 04.11.2026, #276): Hat die Person die App für
# das Schema noch nicht freigegeben, fragt das System vor dem ersten Link „In „Abnehm-App E2E“ öffnen?“.
# Bis dahin kommt der Link nicht an; erst „Öffnen“ stellt ihn zu, und zwar genau einmal (geprüft mit dem
# kumulativen `uhr?stunden=3`: die Testuhr stand danach 3 Stunden vor). „Abbrechen“ verwirft ihn, der
# Seed liefe dann nie. Nach einem „Öffnen“ fragt derselbe Simulator nicht mehr. Der Teilablauf tippt
# deshalb „Öffnen“, sofern die Rückfrage erscheint. Die Beobachtung vom 21.10.2026 (Link kommt schon vor
# der Rückfrage an, „Öffnen“ stellt ihn ein zweites Mal zu) ließ sich nicht wiederholen.
#
# Vorher wartet er, bis ein Bildschirm der App steht: Auf Android geht ein Link verloren, der kurz nach
# `launchApp` noch vor dem Start der App eintrifft (im Emulator beobachtet am 21.10.2026). Gewartet wird
# auf `screen-scroll`, die Inhaltsfläche jedes Bildschirmrahmens (`ScreenFrame` und `OnboardingFrame`,
# `screenScrollId` in src/shell/ScreenFrame.tsx). So trägt sie auch der erste Bildschirm einer frischen
# App, seit #138 der Willkommensschritt des Onboardings, und der Anmeldeschritt (#276).
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: screen-scroll
    timeout: 30000
- openLink: ${SCHEME}://${LINK}
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Öffnen|Open"
          timeout: 5000
          optional: true
      - tapOn:
          text: "Öffnen|Open"
          optional: true
