# E2E-Ablauf (Spezifikation 0, Testing Decisions; #114): Seed anmelden, Tabs und ＋ bedienen, bei
# ausgefallenem Transport eine lokale Änderung anlegen, den 24-Stunden-Hinweis über die Testuhr zeigen,
# den Transport wiederherstellen und den kanonischen Sync beobachten.
#
# Transport: Android schaltet den Flugmodus. iOS-Simulatoren haben keinen
# (https://docs.maestro.dev/api-reference/commands/setairplanemode); dort ersetzt ihn der
# Transport-Fehlermodus des E2E-Builds (`fehler?transport=offline`).
#
# Lokale Änderung: Die Testuhr reist nach Pacific/Kiritimati (UTC+14). Die App setzt die Zeitzone der
# Person wie bei jeder Reise über den Fachbefehl `updatePersonTimeZone` mit Outbox (#110); die Zone
# ändert sie erst mit dem kanonischen Ergebnis. Solange die Operation offen ist, bleibt die Zone der
# Person Europe/Berlin; danach zeigt der Kopf den Tag in Kiritimati: Nach 25 Stunden ist es dort schon
# Freitag, 16.10., in Berlin erst Donnerstag.
# Sobald Spezifikation 3 `water.quick_add` liefert, kommt „+250 ml Wasser“ im ＋-Sheet als zweite
# lokale Änderung dazu.
appId: ${APP_ID}
name: Sync ohne Netz und kanonischer Sync
---
- runFlow: teilablaeufe/anmelden.yaml

# Tabs und ＋ ---------------------------------------------------------------------------------------
# Bis die Bereiche liefern, zeigen Protokoll, Momo und Wir im E2E-Build ihre Platzhalter.
- tapOn:
    id: tab-log
- assertVisible: "Kommt mit: Ernährung"
- tapOn:
    id: tab-momo
- assertVisible: "Kommt mit: Momo, Insel & Challenges"
- tapOn:
    id: tab-partner
- assertVisible: "Kommt mit: Partner & Benachrichtigungen"
- tapOn:
    id: tab-today
- assertVisible: "Hallo, Philipp"
- tapOn:
    id: tab-capture
- assertVisible: "Was möchtest du erfassen?"
- assertVisible: "+250 ml Wasser"
- tapOn: "Gewicht"
- assertVisible: "Kommt mit: Wasser, Sport, Gewicht & Health"
- tapOn: "Fertig"
- assertVisible: "Hallo, Philipp"

# Transport aus -------------------------------------------------------------------------------------
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: teilablaeufe/link.yaml
          env:
            LINK: fehler?transport=offline
      - extendedWaitUntil:
          visible: ".*Transport-Fehlermodus: kein Netz.*"
          timeout: 10000

# Lokale Änderung und 24-Stunden-Hinweis ------------------------------------------------------------
- runFlow:
    file: teilablaeufe/link.yaml
    env:
      LINK: uhr?zone=Pacific%2FKiritimati
- extendedWaitUntil:
    visible: ".*Pacific/Kiritimati.*"
    timeout: 10000
- assertNotVisible: "Noch nicht gesichert – verbinde dich mit dem Internet"
- runFlow:
    file: teilablaeufe/link.yaml
    env:
      LINK: uhr?stunden=25
- extendedWaitUntil:
    visible: "Noch nicht gesichert – verbinde dich mit dem Internet"
    timeout: 15000
- takeScreenshot: nicht-gesichert

# Transport zurück und kanonischer Sync -------------------------------------------------------------
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: teilablaeufe/link.yaml
          env:
            LINK: fehler
- extendedWaitUntil:
    visible: "Freitag, 16.10.2026"
    timeout: 90000
- assertNotVisible: "Noch nicht gesichert – verbinde dich mit dem Internet"
- takeScreenshot: gesichert
