# E2E-Ablauf (Spezifikation 4, Testing Decisions; #184): Seed „Rollenwahl offen“ → annehmen → Momo schlüpft.
#
# Der Seed `rollenwahl-offen` meldet philipp@example.test an: Philipp und Anna sind gekoppelt, die Insel
# wartet auf die Rollen, und Anna hat vorgeschlagen, sich um die Natur zu kümmern. Philipp nimmt im Tab
# „Momo“ an. Die Annahme ist zuerst nur vorgemerkt („Angenommen“); mit dem nächsten Sync schlüpft Momo auf
# dem Server, und der Pull bringt Insel, Felder, Fortschritt und Ereignis. Danach zeigt der Tab die echte
# Insel auf Level 1, beim ersten Öffnen mit „So wächst Momo“.
#
# „Heute“ prüft der Ablauf nicht: Den Momo-Bereich zeigt „Heute“ nur zusammen mit `momo.daily_goals`, und
# den Beitrag liefert erst #136. `momo.character` im Zustand `ready` belegen `hatching-app.test.ts` und
# `MomoTab.test.tsx`.
appId: ${APP_ID}
name: Rollenwahl annehmen, Momo schlüpft
---
# Ein abgebrochener Lauf kann den Flugmodus eingeschaltet hinterlassen.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: teilablaeufe/link.yaml
    env:
      LINK: seed?szenario=rollenwahl-offen&ziel=/momo
- extendedWaitUntil:
    visible: "Anna schlägt eure Rollen vor"
    timeout: 30000
- assertVisible: "Du: Bauen · Anna: Natur"
- takeScreenshot: schluepfen-1-rollenwahl
- tapOn: "Annehmen"

# Momo schlüpft -------------------------------------------------------------------------------------
# Gewartet wird auf den Inhalt des Sheets: „So wächst Momo“ steht auf Android auch im Levelbalken.
- extendedWaitUntil:
    visible: "Tagesziele bringen Energie."
    timeout: 30000
- assertVisible: "Bauen gibt Energie aus und füllt deine Hälfte."
- assertVisible: "Sind beide Hälften voll, steigt Momo ein Level."
- takeScreenshot: schluepfen-2-so-waechst-momo
- tapOn: "Verstanden"
- assertVisible: "Momos Insel, Level 1, 0 eigene Objekte"
# Levelbalken: iOS meldet „Level 1“, Android hängt den Wert an („Level 1, Deine Hälfte zu 0 Prozent gefüllt“).
- assertVisible: "Level 1.*"
- takeScreenshot: schluepfen-3-insel

# Einmal-Flag: Nach einem Wechsel zu „Heute“ und zurück erscheint „So wächst Momo“ nicht wieder.
- tapOn:
    id: tab-today
- assertVisible: "Hallo, Philipp"
- tapOn:
    id: tab-momo
- assertVisible: "Momos Insel, Level 1, 0 eigene Objekte"
- assertNotVisible: "Tagesziele bringen Energie."
- takeScreenshot: schluepfen-4-insel-nach-tabwechsel

# Zweiter Einstieg: Der Levelbalken öffnet „So wächst Momo“ erneut (Impeccable-Kritik zu #184). iOS fasst
# seine Texte im Label „Level 1“ zusammen, deshalb trifft der Tipp den Balken über das Level.
- tapOn: "Level 1.*"
- assertVisible: "Tagesziele bringen Energie."
- takeScreenshot: schluepfen-5-levelbalken-erklaerung
- tapOn: "Verstanden"
