# Gerätelauf Formwechsel bei Level 4 (Spezifikation 4, Abschnitte 6 und 9; #204). Die Bildschirmfotos sind die
# Vorlage der Impeccable-Kritik mit der Hauptaufgabe „Momos neue Form und das neue Gebiet entdecken“.
#
# Seed `formwechsel` als Philipp: Die Insel ist auf Level 4, die Schilfwiese freigeschaltet, und die Entdeckung
# wartet. Das Gerät hat Momo im Tab „Momo“ zuletzt auf Level 3 gesehen. Beim Öffnen des Tabs verwandelt sich Momo
# von der Kaulquappe in den Hüpfer (Überblendung über `duration-celebrate`), danach zieht der Nebel von der
# Schilfwiese ab (noch einmal `duration-celebrate`). Danach holt Philipp im Sheet „Ereignisse“ den Steinfrosch ab
# und findet die Steinmauer im Bau-Sheet. Nicht im Standardumfang von `scripts/e2e-run`; Aufruf mit
# `--ablauf formwechsel`.
appId: ${APP_ID}
name: Formwechsel bei Level 4
---
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: teilablaeufe/link.yaml
    env:
      LINK: seed?szenario=formwechsel&installation=philipp-iphone&ziel=/momo

# Verwandlung und abziehender Nebel ------------------------------------------------------------------------
- extendedWaitUntil:
    visible: "Momos Insel, Level 4.*"
    timeout: 30000
- takeScreenshot: formwechsel-1-verwandlung
- takeScreenshot: formwechsel-2-nebel
# Nach beiden Phasen (2 × 1,2 s) steht Momo ruhig als Hüpfer, die Schilfwiese ohne Nebel.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: formwechsel-3-danach

# Entdeckung im Sheet „Ereignisse“ ------------------------------------------------------------------------
- tapOn: "Ereignisse"
- extendedWaitUntil:
    visible: "Schilfwiese entdeckt"
    timeout: 10000
- assertVisible: "Neues Gebiet: Schilfwiese"
- assertVisible: "Neue Gebiete"
- assertVisible: "Neue Baupläne für eure Insel: Steinmauer, Briefkasten, Seerosenteich und Schilfgras"
- assertVisible: "Für dein Lager: Steinfrosch"
- takeScreenshot: formwechsel-4-entdeckung
# Der Knopf trägt für Bedienungshilfen den Namen der Deko; Maestro findet ihn darüber.
- tapOn: "Steinfrosch abholen"
- extendedWaitUntil:
    visible: "Steinfrosch liegt jetzt in deinem Lager"
    timeout: 10000
- assertNotVisible: "Steinfrosch abholen"
- takeScreenshot: formwechsel-5-abgeholt
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 20%
          end: 50%, 95%
          duration: 400
- extendedWaitUntil:
    notVisible: "Steinfrosch liegt jetzt in deinem Lager"
    timeout: 10000

# Die neuen Baupläne im Bau-Sheet ------------------------------------------------------------------------
- tapOn: "Bauen"
- extendedWaitUntil:
    visible: "Steinmauer.*"
    timeout: 10000
- assertVisible: "Briefkasten.*"
- takeScreenshot: formwechsel-6-bauplaene
