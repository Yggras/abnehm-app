# Gerätelauf Sheet „Ereignisse“ (Spezifikation 4, Abschnitt 9; #202): Seed „gekoppelt“ → „Ereignisse“ zeigt
# Igel Ilse unter „Neu auf der Insel“ → schließen → eine Sitzbank bauen → „Ereignisse“ zeigt den Wunsch unter
# „Offene Wünsche“ mit „Belohnung abholen“ → abholen → der Brunnen steht im Bau-Sheet. Die Bildschirmfotos
# sind die Vorlage der Impeccable-Kritik.
#
# Im Seed `gekoppelt` hat Philipp (Bauen, Seite a) Level 3 und 23 Energie. Igel Ilse wünscht sich von ihm
# eine Sitzbank und bringt den Bauplan Brunnen (`packages/contracts/seeds/ereignisse.ts`). Wie in
# `objekt-und-lager` liegt das freie Feld (5, 7) bei 29 % / 45 % des Bildschirms. Ein offenes Sheet schließt
# auf Android System-Zurück, auf iOS ein Wischen nach unten. Nicht im Standardumfang von `scripts/e2e-run`;
# Aufruf mit `--ablauf insel-ereignisse`.
appId: ${APP_ID}
name: Insel-Ereignisse und Besucher mit Wunsch
---
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: teilablaeufe/link.yaml
    env:
      LINK: seed?szenario=gekoppelt&ziel=/momo
# „So wächst Momo“ erscheint beim ersten Öffnen nach dem Schlüpfen (siehe `bau-modus`).
- extendedWaitUntil:
    visible: "Verstanden|Momos Insel, Level 3.*"
    timeout: 30000
- runFlow:
    when:
      visible: "Verstanden"
    commands:
      - tapOn: "Verstanden"
- assertVisible: "Momos Insel, Level 3, 10 eigene Objekte"

# Neu auf der Insel: Igel Ilse mit Wunsch, noch nicht erfüllt ---------------------------------------------
- tapOn: "Ereignisse"
- extendedWaitUntil:
    visible: "Igel Ilse ist zu Besuch"
    timeout: 10000
- assertVisible: "Neu auf der Insel"
- assertVisible: "Wünscht sich: Sitzbank"
- assertVisible: "Bringt den Bauplan Brunnen mit"
- assertNotVisible: "Belohnung von Igel Ilse abholen"
- takeScreenshot: ereignisse-1-neu
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 20%
          end: 50%, 95%
          duration: 400
- extendedWaitUntil:
    notVisible: "Igel Ilse ist zu Besuch"
    timeout: 10000

# Den Wunsch erfüllen: eine Sitzbank auf Feld (5, 7) -------------------------------------------------------
- tapOn: "Bauen"
- extendedWaitUntil:
    visible: "Sitzbank, 2 Energie"
    timeout: 10000
- tapOn: "Sitzbank, 2 Energie"
- extendedWaitUntil:
    visible: "Sitzbank bauen.*"
    timeout: 10000
- tapOn:
    point: "29%,45%"
- extendedWaitUntil:
    visible: "Momos Insel, Level 3, 11 eigene Objekte"
    timeout: 10000

# Offene Wünsche: Der Wunsch ist erfüllt, die Belohnung lässt sich abholen ---------------------------------
- tapOn: "Ereignisse"
- extendedWaitUntil:
    visible: "Offene Wünsche"
    timeout: 10000
- assertNotVisible: "Neu auf der Insel"
# Der Knopf trägt für Bedienungshilfen den Namen des Besuchers; Maestro findet ihn darüber.
- assertVisible: "Kein Zeitdruck.*"
- assertVisible: "Belohnung von Igel Ilse abholen"
- takeScreenshot: ereignisse-2-erfuellbar
- tapOn: "Belohnung von Igel Ilse abholen"
- extendedWaitUntil:
    visible: "Neuer Bauplan: Brunnen"
    timeout: 10000
- assertVisible: "Gerade wartet niemand auf dich.*"
- takeScreenshot: ereignisse-3-abgeholt
