# Gerätelauf „Fotos von heute“ (Spezifikation 5, Abschnitt 2; #122, #165): Seed „gekoppelt“ öffnet „Wir“ als
# Philipp. Anna hält Ernährung privat, teilt aber ihre Fotos; ihr Mittagessen von heute hat ein geteiltes Foto
# (`packages/contracts/seeds/gekoppelt.ts`, Erweiterungspunkt `mealPhotos`). Online zeigt die Partnerübersicht
# die Zeile „Fotos von heute“ mit der Vorschau, die über Fotoliste und Handle vom E2E-Backend kommt. Ein Tipp
# öffnet die Vollbildansicht. Ohne Netz verschwindet die Zeile ohne Fehlermeldung.
#
# Transport: Android schaltet den Flugmodus, iOS-Simulatoren haben keinen; dort ersetzt ihn der
# Transport-Fehlermodus des E2E-Builds (`fehler?transport=offline`, wie in `mahlzeitenfotos.yaml`). Die
# Bildschirmfotos sind die Vorlage der Impeccable-Kritik. Einzeln mit `scripts/e2e-run --ablauf partnerfotos`.
appId: ${APP_ID}
name: Fotos von heute in „Wir“
---
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: teilablaeufe/link.yaml
    env:
      LINK: seed?szenario=gekoppelt&ziel=/partner

# Partnerübersicht mit „Fotos von heute“ ----------------------------------------------------------------
- extendedWaitUntil:
    visible: "Fotos von heute"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "partnerfoto-vorschau"
    timeout: 15000
- assertVisible: "Mahlzeitenfoto von Anna, Mittagessen"
- takeScreenshot: partnerfotos-1-wir

# Vollbildansicht --------------------------------------------------------------------------------------
- tapOn: "Mahlzeitenfoto von Anna, Mittagessen"
- extendedWaitUntil:
    visible:
      id: "partnerfoto-gross"
    timeout: 15000
- assertVisible: "1 von 1"
- takeScreenshot: partnerfotos-2-vollbild
- tapOn: "Schließen"
- extendedWaitUntil:
    visible: "Fotos von heute"
    timeout: 10000

# Ohne Netz keine Zeile -------------------------------------------------------------------------------
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: teilablaeufe/link.yaml
          env:
            LINK: fehler?transport=offline
      - extendedWaitUntil:
          visible: ".*Transport-Fehlermodus: kein Netz.*"
          timeout: 10000
- tapOn:
    id: tab-partner
- extendedWaitUntil:
    notVisible: "Fotos von heute"
    timeout: 10000
- assertVisible:
    id: "wir-partneruebersicht"
- takeScreenshot: partnerfotos-3-offline

# Netz zurück: frische Liste ---------------------------------------------------------------------------
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: teilablaeufe/link.yaml
          env:
            LINK: fehler
- tapOn:
    id: tab-partner
- extendedWaitUntil:
    visible: "Fotos von heute"
    timeout: 30000
