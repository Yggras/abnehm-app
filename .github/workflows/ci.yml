name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner privater Repos haben 2 vCPUs, Vitest nutzt dort nur einen Worker. Die langsamen Tests
# laufen deshalb in eigenen Jobs nebeneinander statt nacheinander in einem.
jobs:
  checks:
    name: Typprüfung, Lint und App-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: App-Tests (Jest)
        run: npm run test:app

  node-tests:
    name: Backend- und Pakettests (Teil ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Schnappschüsse der Katalogversionen auf main sind unveränderlich; der Test vergleicht mit
      # origin/main (packages/game-rules/test/catalog-versions.test.ts).
      - name: main für den Vergleich der Katalogversionen holen
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # Startet über docker compose ein eigenes, flüchtiges Postgres (apps/backend/test/compose.yaml).
      - name: Backend- und Pakettests (Vitest)
        run: npm run test:node -- --project '!release' --shard ${{ matrix.shard }}/2

  release-locks:
    name: Release-Sperren
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Echter `expo export` der App im Produktions- und Development-Modus (test/release-sperren.test.ts).
      - name: Release-Sperren (Vitest)
        run: npm run test:node -- --project release

  backend-image:
    name: Backend-Image ohne App- und Test-Abhängigkeiten
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Der Dockerfile-Build prüft, dass Expo, Jest und Drizzle Kit nicht installiert sind.
      - run: docker build --file apps/backend/Dockerfile --tag abnehm-backend-ci .
      - run: docker run --rm --entrypoint node abnehm-backend-ci --input-type=module -e 'await import("./apps/backend/src/backend.ts")'
