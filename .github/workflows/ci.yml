name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typprüfung, Lint und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: App-Tests (Jest)
        run: npm run test:app

      # Startet über docker compose ein eigenes, flüchtiges Postgres (apps/backend/test/compose.yaml).
      - name: Backend- und Pakettests (Vitest)
        run: npm run test:node
